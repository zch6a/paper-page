name: Example page
# The README's "Publish it" workflow, run for real: the made-up example (examples/tiny-fields) published on GitHub
# Pages at https://zch6a.github.io/paper-page/. No build step and no project code: it only publishes the folder.
# A test keeps the actions pinned here the same as in the README.
on:
  push: { branches: [main], paths: ["examples/tiny-fields/**"] }
  workflow_dispatch:
permissions:
  contents: read
concurrency: pages
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: examples/tiny-fields }
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
