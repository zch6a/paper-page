[project]
name = "paper-page"
version = "0.1.1"
description = "A project page for your paper from its arXiv ID: title, authors, links, teaser figure, abstract and BibTeX, with the meta tags Google Scholar and link previews read; one static HTML file for GitHub Pages."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "zch6a" }]
keywords = ["arxiv", "project-page", "academic", "paper", "github-pages", "static-site", "bibtex", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# No dependencies: urllib and xml.etree for the arXiv API, tarfile for the source, string templates for the page.
dependencies = []

[project.urls]
Homepage = "https://github.com/zch6a/paper-page"
Issues = "https://github.com/zch6a/paper-page/issues"

[project.scripts]
paper-page = "paper_page.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_page"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/"]  # images for the GitHub page only

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src", "tests"]
addopts = "--doctest-modules --import-mode=importlib"

[tool.mypy]
python_version = "3.10"
files = ["src/paper_page"]
ignore_missing_imports = true

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/paper_page/render.py" = ["E501"]  # the page's markup and style, kept as written
